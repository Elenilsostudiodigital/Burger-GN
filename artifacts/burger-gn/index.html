<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Burger GN</title>
    <meta name="description" content="Burger GN — cardápio e pedidos. Instale o app para pedir com mais praticidade." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="application-name" content="Burger GN" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Burger GN" />
    <meta property="og:title" content="Burger GN" />
    <meta property="og:description" content="Cardápio e pedidos Burger GN." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Burger GN" />
    <meta name="twitter:description" content="Cardápio e pedidos Burger GN." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
      /* Splash while the JS bundle boots (standalone / first paint). */
      html, body {
        background: #0a0a0a;
        margin: 0;
      }
      #pwa-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0a0a0a;
        transition: opacity 0.35s ease;
      }
      #pwa-boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      #pwa-boot-splash p {
        color: #f59e0b;
        font-family: "DM Sans", system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.85rem;
        margin: 0;
      }
      #pwa-boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pwa-boot-splash" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <p>Burger GN</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        function hideSplash() {
          var el = document.getElementById("pwa-boot-splash");
          if (!el) return;
          el.classList.add("is-hidden");
          setTimeout(function () { el.remove(); }, 400);
        }
        if (document.readyState === "complete") {
          setTimeout(hideSplash, 280);
        } else {
          window.addEventListener("load", function () { setTimeout(hideSplash, 280); });
        }
        setTimeout(hideSplash, 4000);
      })();
    </script>
  </body>
</html>
